# Containerized cloud-LLM deployment for next-signal.
# See docs/containerized-deployment.md for the full design.
#
#   docker compose up --build            # postgres + bootstrap + dashboard + scheduler
#
# Cloud-LLM by default: OMLX is left unset so model profiles fall back to the
# cloud (DeepSeek/Claude, per configs/models.yaml). To use the LOCAL LLM
# embedder, run an OMLX server on the HOST and set, in .env:
#   OMLX_BASE_URL=http://host.docker.internal:<port>/v1
# (host.docker.internal is wired below for Linux via host-gateway too.)

name: next-signal

# ---- Postgres connection, overridable from the environment/.env ----
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-next_signal}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-next_signal}
  POSTGRES_DB: ${POSTGRES_DB:-next_signal}

# ---- Shared app-container config (image, env, mounts, host bridge) ----
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GBRAIN_REF: ${GBRAIN_REF:-a25209bbb2bacf1b88e06fd5282b27f1bf4a3e7a}
      OPENCLI_REF: ${OPENCLI_REF:-v1.8.1}
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.145.0}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.220}
  image: next-signal:latest
  # Cloud API keys come from .env (secrets stay OUT of the image).
  env_file:
    - .env
  environment:
    # These override whatever .env holds so the container is self-consistent:
    # point at the postgres SERVICE, and use in-container paths.
    DATABASE_URL: postgresql://${POSTGRES_USER:-next_signal}:${POSTGRES_PASSWORD:-next_signal}@postgres:5432/${POSTGRES_DB:-next_signal}
    NEXT_SIGNAL_STATE_DIR: /state
    WIKI_DIR: /wiki
    WIKI_RAW_DIR: /wiki-raw
    GBRAIN_HOME: /state/gbrain          # gbrain config/cache dir (config.json persists here)
    # gbrain uses its POSTGRES engine against a dedicated DB in the same server.
    # The bun-compiled binary can't run PGLite (extension bundles aren't embedded),
    # and pgvector already ships `vector` + `pg_trgm`, so Postgres is the fit.
    GBRAIN_DATABASE_URL: postgresql://${POSTGRES_USER:-next_signal}:${POSTGRES_PASSWORD:-next_signal}@postgres:5432/gbrain
    OPENCLI_BIN: /opt/opencli/dist/src/main.js
    HOME: /root                              # writable HOME for npx (folocli) cache
    DISABLE_AUTOUPDATER: "1"                 # image rebuilds own Claude upgrades
  volumes:
    - pstate:/state
    # Host knowledge dirs, mounted read-write because ingest/re-index writes
    # into them. Default to repo-relative directories so the stack starts
    # against an untouched .env; point WIKI_DIR at your own vault to override.
    #
    # The `./` prefix is REQUIRED. Compose reads a source without a leading
    # `./` or `../` as a NAMED VOLUME, which would mount an empty box instead
    # of a directory — and would do it silently, presenting an empty wiki
    # rather than an error.
    - ${WIKI_DIR:-./state/wiki}:/wiki
    - ${WIKI_RAW_DIR:-./state/wiki-raw}:/wiki-raw
  # Lets the container reach a HOST-side OMLX server via
  # host.docker.internal on Linux (Docker Desktop provides it already).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

# Dashboard and scheduler invoke the coding-agent CLIs. Keep credentials in
# provider-owned homes, separate from next-signal's /state volume and image.
x-app-with-coding-agent-auth: &app-with-coding-agent-auth
  <<: *app
  volumes:
    - pstate:/state
    - codex_auth:/root/.codex
    - claude_auth:/root/.claude
    # Same defaults as x-app above; the `./` prefix is required for the same
    # reason. Keep these two lists in step.
    - ${WIKI_DIR:-./state/wiki}:/wiki
    - ${WIKI_RAW_DIR:-./state/wiki-raw}:/wiki-raw

services:
  # --- Postgres 16 + pgvector: next-signal's main DB (agno + business tables) ---
  postgres:
    image: pgvector/pgvector:pg16
    environment: *postgres-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to inspect the DB from the host:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-next_signal} -d ${POSTGRES_DB:-next_signal}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- One-shot schema bootstrap: next-signal main DB + gbrain DB/init (idempotent) ---
  bootstrap:
    <<: *app
    command: ["sh", "scripts/container_bootstrap.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Dashboard (Next.js, production build) on :3000 ---
  # Spawns `next-signal` CLI children + gbrain/folocli as subprocesses, so it runs
  # from the same image. `next start` binds 0.0.0.0, reachable once published.
  dashboard:
    <<: *app-with-coding-agent-auth
    command: ["next-signal", "dashboard", "--start", "--port", "3000"]
    ports:
      # Login/logout endpoints mutate provider auth state. Keep them local by
      # default; use an authenticated reverse proxy before publishing remotely.
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  # --- Wall-clock scheduler: fires the radar chain on a schedule (:no ports) ---
  # Deliberately not behind a Compose profile. An absent ~/.next-signal/schedule.json
  # reads as disabled, so a stack whose operator never opens the settings page
  # gets an idle container rather than a crash loop — and turning the schedule on
  # in the dashboard needs no `docker compose` flag to have been remembered.
  scheduler:
    <<: *app-with-coding-agent-auth
    command: ["next-signal", "schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:      # Postgres data
  pstate:      # NEXT_SIGNAL_STATE_DIR (host default ~/.next-signal) + gbrain PGLite
  codex_auth:  # provider-owned /root/.codex login/config, shared by app services
  claude_auth: # provider-owned /root/.claude login/config, shared by app services
