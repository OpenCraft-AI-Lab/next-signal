# info-radar 打分评测集 —— 人工标注的 gold labels。
#
# 用 `scripts/radar_eval.py` 回放真实 tier1 / tier2 流程，衡量提示词改动的效果。
# `item` 是 radar_items.id。`expect` 是期望 verdict；keep 时 min/max 给出期望
# 分数区间（评测取多次重复的均值落区间内算通过）。
#
# 六个桶各有各的作用，缺一不可：
#   A-false-drop    生产环境错杀的行业信号 —— 改动要救回来
#   B-under-scored  生产环境留下但压到 65 以下（dashboard 默认不显示）的
#   C-true-negative 生产环境正确丢掉的噪音 —— 防止改过头，这是最重要的一桶
#   D-true-positive 生产环境正确给高分的 —— 防止改动把好的一起拉下来
#   E-over-scored   窄领域论文/日报，分数应该低于行业大事
#   F-consistency   同一事件的分裂判决，应当收敛

label_set: v1

