# info-radar analysis goals — the shipped EXAMPLE, not the file that runs.
#
# The runtime goals file lives in user state (`~/.next-signal/goals.yaml`, or
# `/state/goals.yaml` in a container) so the dashboard and the scheduler share
# one copy and a rebuild cannot discard it. Container bootstrap copies this file
# there on a fresh install; the dashboard's /goals page is the place to edit it
# afterwards. This file is never written to.
#
# Edit the goals to describe what you actually want to learn from your feeds. The
# two-tier analysis workflow (next_signal/workflows/info_radar_analysis/) ALL
# revolves around them: tier-1 drops items with no plausible bearing on any goal,
# and tier-2 writes the impact analysis grounded in them.
#
# Schema (strict — unknown keys fail the loader fast):
#   goals:
#     - name: <kebab-case unique id>
#       description: <one-sentence purpose, used in agent prompts>
#       topics: [<broad area>, ...]        # what kinds of things matter
#       keywords: [<exact word>, ...]      # high-precision tokens
#
# At least one goal is required to RUN. Clearing every goal is allowed and is
# preserved across restarts, but analysis then aborts with RuntimeError — there
# is no implicit default goal.

goals:
  - name: ai-research-tracking
    description: "Stay current on AI research with practical engineering impact."
    topics:
      - "LLM inference optimization"
      - "agentic systems / tool use"
      - "open-source models and runtimes"
    keywords:
      - "mlx"
      - "vllm"
      - "agno"
      - "claude code"
      - "open source agent"
