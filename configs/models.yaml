# Per-provider concurrent inference limits. See design.md §3.17.
# Local providers (omlx) need strict caps — single GPU/MLX process can't
# parallelize cleanly. Cloud providers get a generous defensive cap, far
# above typical use, so 429s still hit agno's retry layer first; the cap
# is there to stop a runaway loop from blasting the API.
concurrency:
  omlx: 2
  claude: 64
  openai: 64
  gemini: 32
  deepseek: 32
  codex_cli: 2
  claude_cli: 2

profiles:
  # The single local model. Everything runs here; cloud is fallback only.
  local:
    provider: omlx
    model_id: Qwen3.5-122B-A10B-mlx-oQ4
    temperature: 0.2
    top_p: 0.85
    max_tokens: 32768
    fallback_profile: deepseek_smart

  # Same underlying model + endpoint, but with a tight token cap for
  # structured-output agents (output_schema). xgrammar-constrained
  # generation can pathologically loop trying to satisfy a schema; a small
  # max_tokens converts a 10-min hang into a ~100s clean failure that our
  # per-item error path handles. Outputs for tier1/tier2/dedup schemas are
  # all well under 2000 tokens; 4096 leaves headroom.
  #
  # Removing the cap was tried (Alibaba's docs say ``max_tokens`` with
  # structured output truncates JSON). It did NOT fix our 8 / ~85 stochastic
  # tier2 truncations — those happen at ~100 tokens generated, nowhere near
  # the cap, so they're an unrelated xgrammar/OMLX premature-EOS issue. Cap
  # removal also reintroduced the runaway hang. Keep the cap. Stochastic
  # truncations are handled by json5 fallback + per-item error isolation.
  local_structured:
    provider: omlx
    model_id: Qwen3.5-122B-A10B-mlx-oQ4
    temperature: 0.2
    top_p: 0.85
    max_tokens: 4096
    # Read-timeout guard, complementary to the max_tokens cap above. The cap
    # bounds runaway *generation*; this bounds a stalled *connection* (OMLX
    # occasionally returns 200 then never finishes the body — e.g. after a 507
    # resource crunch). Without it the openai SDK default is 600s, long enough
    # to freeze a whole batch behind one item. 180s clears <2000-token
    # structured outputs with headroom; a real stall trips ReadTimeout, which
    # runner.py's per-item except catches as tier2_error and moves on.
    timeout: 180
    fallback_profile: deepseek_structured

  claude_smart:
    provider: claude
    model_id: claude-sonnet-4-5
    temperature: 0.4

  claude_fast:
    provider: claude
    model_id: claude-haiku-4-5
    temperature: 0.4

  # reasoning_effort: low — deepseek-v4-flash defaults to thinking mode ON at
  # effort "high", which is slower and bills reasoning tokens as output. This
  # fallback doesn't need full chain-of-thought; low keeps some reasoning
  # without the cost/latency hit of the default.
  deepseek_smart:
    provider: deepseek
    model_id: deepseek-v4-flash
    temperature: 0.4
    top_p: 0.85
    extra:
      reasoning_effort: low

  # Tight token cap mirrors local_structured — keeps structured-output agents
  # from hanging if json_schema constrained decoding loops. Thinking mode is
  # disabled outright (not just low effort): with a 4096-token cap, default
  # high-effort reasoning could burn the whole budget on reasoning_content
  # before ever emitting the JSON answer, turning the cap into a guaranteed
  # truncation instead of a safety net.
  deepseek_structured:
    provider: deepseek
    model_id: deepseek-v4-flash
    temperature: 0.2
    top_p: 0.85
    max_tokens: 4096
    extra:
      extra_body:
        thinking:
          type: disabled

  # Optional cloud fallbacks — uncomment when keys are configured.
  # gpt:
  #   provider: openai
  #   model_id: gpt-5.2
  #   temperature: 0.4

# Suggested embedder models for the dedup gate — form prefill, NOT defaults.
# Nothing here selects a provider or reaches the pipeline: an unconfigured
# settings pane opens with these values, and only what an operator saves into
# `~/.next-signal/embedding.json` ever runs (see
# next_signal.core.embedding_preferences). A fresh install has no embedder at
# all, which turns deduplication off until someone chooses one.
#
# Every embedder must emit exactly 1024 values — get_embedder rejects anything
# else, and the hosted providers request `dimensions: 1024` — so
# radar_pushed_topics.embedding stays vector(1024) across a provider switch.
# There is no generic-endpoint entry here on purpose: its URL and vector-space
# id have no honest repo-wide default and are operator state. Neither is the
# local endpoint, for the same reason.
embedders:
  local:
    provider: omlx
    model_id: Qwen3-Embedding-0.6B-8bit
    dim: 1024
  openai:
    provider: openai
    model_id: text-embedding-3-small
    dim: 1024
