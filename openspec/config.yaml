context: |
  ## What this is

  `next-signal` (Python package `next_signal`) — a local-first info-radar + knowledge
  pipeline on agno 2.6+. One AgentOS process hosts every agent, team, and
  workflow; CLI and Dashboard call the same capability surface.

  ## Shape

  Orchestrator chassis + runnable units:

  - **Chassis** (`src/next_signal/core`, `agents`, `orchestrator`, `interfaces`,
    `os_app.py`).
  - **Runnables** (`configs/agents`, `configs/workflows`, `configs/teams`) with
    implementations in `src/next_signal/agents`, `src/next_signal/workflows`, and `src/next_signal/teams`.
  - **Capabilities**: agent-facing tools in `src/next_signal/tools/<domain>/`; provider
    adapters in `src/next_signal/integrations/<domain>/`.

  Dependencies move downward only: workflows/agents/teams -> tools -> integrations -> core.

  ## Conventions

  - Always run Python through `uv` (`uv run pytest -q`, `uv run next-signal ...`).
  - Agent/workflow/team behavior lives in `configs/` YAML; Python defines the shape.
  - Tools are registered explicitly through `src/next_signal/registry.py` and package-level
    `tools/<domain>/register()` hooks.
  - Tests: prefer fixtures + real calls over mocks; integration tests skip by default.

  ## Spec layout

  `openspec/specs/` is flat (OpenSpec requirement); module grouping is by name
  prefix: `core-*` (chassis), `knowledge-*`, `info-filter-*`.

  ## Human docs

  Architecture, development, operations, and per-module docs live in `../docs/`.

